apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alert-middleware-ingress
  namespace: alert-middleware
  labels:
    app.kubernetes.io/name: alert-correlation-middleware
    app.kubernetes.io/component: app
  annotations:
    # ⚠️ Adjust for your ingress controller (nginx, traefik, ALB, etc.)
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        # ⚠️ Replace with your domain
        - alerts-webhook.example.com
      secretName: alert-middleware-tls
  rules:
    - host: alerts-webhook.example.com
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: alert-middleware-svc
                port:
                  number: 80
          - path: /health
            pathType: Exact
            backend:
              service:
                name: alert-middleware-svc
                port:
                  number: 80
          - path: /ready
            pathType: Exact
            backend:
              service:
                name: alert-middleware-svc
                port:
                  number: 80
          - path: /metrics
            pathType: Exact
            backend:
              service:
                name: alert-middleware-svc
                port:
                  number: 80
