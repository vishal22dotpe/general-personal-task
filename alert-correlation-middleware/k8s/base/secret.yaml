##############################################################################
# ⚠️  IMPORTANT: Replace the base64 placeholders before applying.
#     In production, use ExternalSecrets, Sealed Secrets, or Vault.
#
#     echo -n 'xoxb-your-token' | base64
#     echo -n 'your-webhook-secret' | base64
##############################################################################
apiVersion: v1
kind: Secret
metadata:
  name: alert-middleware-secrets
  namespace: alert-middleware
  labels:
    app.kubernetes.io/name: alert-correlation-middleware
    app.kubernetes.io/component: app
type: Opaque
data:
  # Replace with: echo -n 'xoxb-your-slack-bot-token' | base64
  SLACK_BOT_TOKEN: eG94Yi1wbGFjZWhvbGRlcg==
  # Replace with: echo -n 'your-webhook-secret' | base64  (optional)
  WEBHOOK_SECRET: ""
