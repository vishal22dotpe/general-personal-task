###############################################################################
# Local development stack: Alert Correlation Middleware + Redis
###############################################################################
version: "3.9"

services:
  # ── Alert Correlation Middleware ─────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alert-middleware
    ports:
      - "8000:8000"
    environment:
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-xoxb-placeholder}
      - SLACK_DEFAULT_CHANNEL=${SLACK_DEFAULT_CHANNEL:-#alerts}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_TTL_SECONDS=604800
      - DEDUP_WINDOW_SECONDS=300
      - RESOLVE_UPDATE_ORIGINAL=true
      - RESOLVE_THREAD_REPLY=true
      - LOG_LEVEL=INFO
      - ENVIRONMENT=development
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - alert-net

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: alert-redis
    ports:
      - "6379:6379"
    command: >
      redis-server
      --maxmemory 128mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - alert-net

volumes:
  redis-data:
    driver: local

networks:
  alert-net:
    driver: bridge
