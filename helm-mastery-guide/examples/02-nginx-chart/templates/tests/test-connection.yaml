apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "my-nginx.fullname" . }}-test-connection"
  labels:
    {{- include "my-nginx.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: wget
      image: busybox:1.36
      command: ['wget']
      args: ['{{ include "my-nginx.fullname" . }}:{{ .Values.service.port }}', '-O', '/dev/null', '-q']
  restartPolicy: Never
