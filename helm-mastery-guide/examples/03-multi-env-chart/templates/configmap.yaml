apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "multi-env-app.fullname" . }}-config
  labels:
    {{- include "multi-env-app.labels" . | nindent 4 }}
data:
  APP_ENV: {{ .Values.config.environment | quote }}
  APP_PORT: {{ .Values.config.port | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DB_HOST: {{ .Values.config.database.host | quote }}
  DB_PORT: {{ .Values.config.database.port | quote }}
  DB_NAME: {{ .Values.config.database.name | quote }}
  ENABLE_METRICS: {{ .Values.config.features.enableMetrics | quote }}
  ENABLE_TRACING: {{ .Values.config.features.enableTracing | quote }}
  ENABLE_DEBUG: {{ .Values.config.features.enableDebugMode | quote }}
