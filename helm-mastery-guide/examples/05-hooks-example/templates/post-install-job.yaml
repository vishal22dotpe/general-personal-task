{{- if .Values.hooks.postInstall.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-post-install
  labels:
    app: {{ .Values.appName }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  template:
    metadata:
      name: {{ .Release.Name }}-post-install
    spec:
      restartPolicy: Never
      containers:
        - name: post-install
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              echo "═══════════════════════════════════════"
              echo "  POST-INSTALL HOOK RUNNING"
              echo "  {{ .Values.hooks.postInstall.message }}"
              echo "  Release: {{ .Release.Name }}"
              echo "  Time: $(date)"
              echo "═══════════════════════════════════════"
              echo "Verifying deployment..."
              sleep 2
              echo "Deployment verified successfully!"
  backoffLimit: 1
{{- end }}
