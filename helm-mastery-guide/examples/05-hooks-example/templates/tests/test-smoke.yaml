apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-smoke
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  containers:
    - name: smoke-test
      image: busybox:1.36
      command:
        - /bin/sh
        - -c
        - |
          echo "═══════════════════════════════════════"
          echo "  SMOKE TEST RUNNING"
          echo "  Release: {{ .Release.Name }}"
          echo "═══════════════════════════════════════"
          echo "Checking ConfigMap exists..."
          # In a real test, you'd check services, endpoints, etc.
          echo "✅ All smoke tests passed!"
          exit 0
  restartPolicy: Never
